# ============================================================================ #
# .github/workflows/checkin.yml
# New API 每日自动签到（GitHub Actions）
#
# 触发方式：
#   1. schedule —— 每天北京时间 00:05（GitHub Actions 的 cron 使用 UTC，
#      UTC 16:05 = 北京 00:05）。注意：schedule 触发不保证准点，可能有延迟。
#   2. workflow_dispatch —— 仓库 Actions 页面手动运行，可选 dry-run 只验连通性，
#      也可临时改分片大小。
#
# 分片并行（每 N 个账号一个 job）：
#   plan job 先按真实账号名单算出分片矩阵，再由 checkin job 用 matrix 并行跑。
#   账号名单来自和签到完全相同的配置加载路径（含 config_sync 远程同步），所以
#   平台上刚加的账号不会被漏掉、刚停用的也不会白占一个分片。
#   各分片通过 --account 收到自己那一批账号名，互不重叠。
#
# 首次使用前必须配置（重要！）：
#   GitHub 仓库 -> Settings and variables -> Actions -> New repository secret
#     Name:  CONFIG_JSON_B64（推荐）
#     Value: 完整 config.json 的 base64 文本（含账号 cookie 与 AI api_key）
#
#   Windows PowerShell 生成方式：
#     [Convert]::ToBase64String([IO.File]::ReadAllBytes('config.json'))
#   Linux/macOS 生成方式：
#     base64 -w 0 config.json
#
#   兼容旧配置：仍支持 CONFIG_JSON（直接存完整 JSON），但结构化 Secret 会让
#   GitHub 自动脱敏误命中 JSON 内的账号名、IP、user_id 和数字；迁移到
#   CONFIG_JSON_B64 后，日志中的普通业务数字不会再被 Secret 掩码误伤。
#
# 【公共仓库安全须知】
#   - Secret 的值只有仓库所有者/管理员可见，日志中会被 GitHub 自动打码为 ***；
#   - 但 Actions 运行日志、失败截图(artifact)、缓存对外是公开可读的，因此：
#       * 本工作流不缓存 data/sessions.json（公共缓存可被他人读取）；
#       * 日志会公开显示账号名、站点 URL、AI 的 base_url 和 /api/user/self
#         返回的用户名（cookie 与 api_key 已在程序内脱敏打印）；
#       * 注意：账号名现在会出现在**每一行**日志前缀里（并行时用来区分账号），
#         所以仍建议把 config.json 里的 name 换成 A1/站点1 这类代号；
#   - fork 的仓库不会继承你的 secret，别人 fork 后无法读取你的配置。
# ============================================================================ #

name: 每日签到

on:
  schedule:
    # UTC 16:05 = 北京时间 00:05
    - cron: '5 16 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只做连通性检查，不真签到'
        type: boolean
        default: false
      shard_size:
        description: '每个 job 跑多少个账号'
        type: string
        default: '30'

permissions:
  contents: read

# 同一时间只允许一个签到任务在跑，防止并发触发互相干扰。
# 这是 workflow 级的：同一次运行内部的分片 job 属于同一个 group，不会互相排队。
concurrency:
  group: checkin
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------- #
  # 第一段：算分片。只解析配置、不启浏览器，所以不装 camoufox/patchright
  # ---------------------------------------------------------------------- #
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      total: ${{ steps.plan.outputs.total }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖（剔掉浏览器相关，算名单不需要）
        run: |
          # 版本仍取自 requirements-ci.txt，只是去掉两个几百 MB 的浏览器包，
          # 避免为了数个账号名去下载整个 Firefox
          grep -vE '^(camoufox|patchright)' requirements-ci.txt > /tmp/req-plan.txt
          pip install -r /tmp/req-plan.txt

      - name: 写入配置（来自 GitHub Secrets）
        env:
          CONFIG_JSON_B64: ${{ secrets.CONFIG_JSON_B64 }}
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: |
          if [ -n "$CONFIG_JSON_B64" ]; then
            printf '%s' "$CONFIG_JSON_B64" | base64 --decode > config.json
          elif [ -n "$CONFIG_JSON" ]; then
            printf '%s' "$CONFIG_JSON" > config.json
          else
            echo "::error::未设置 CONFIG_JSON_B64 secret。请添加完整 config.json 的 base64 文本；旧 CONFIG_JSON 仍兼容"
            exit 2
          fi
          python -c "import json,pathlib;json.loads(pathlib.Path('config.json').read_text(encoding='utf-8'));print('config.json 校验通过')"

      - name: 算分片名单
        id: plan
        run: |
          python main.py --shard-plan "${{ inputs.shard_size || '30' }}"
          python - <<'PY'
          import json, os, pathlib
          plan = json.loads(pathlib.Path("data/shard-plan.json").read_text(encoding="utf-8"))
          # 矩阵里**只放分片序号**，绝不放账号名：账号名是从 secret 解出来的配置里取的，
          # GitHub 判定 job output「可能含 secret」时会整个跳过该 output，下游拿到空串，
          # fromJson('') 直接报 empty input。名单由每个 job 用 --shard 在内部自己算。
          matrix = list(range(1, plan["total"] + 1))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("matrix=" + json.dumps(matrix) + "\n")
              fh.write(f"total={plan['total']}\n")
              fh.write(f"count={plan['count']}\n")
          print(f"::notice::{plan['count']} 个启用账号，切成 {plan['total']} 个分片")
          PY

  # ---------------------------------------------------------------------- #
  # 第二段：按分片并行签到
  # ---------------------------------------------------------------------- #
  checkin:
    needs: plan
    # 一个账号都没启用时 matrix 会是空数组，GitHub 会直接把 job 判为失败，先挡掉
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    name: 签到分片 ${{ matrix.shard }}/${{ needs.plan.outputs.total }}
    # 不设 timeout-minutes：走 GitHub 的默认值 360 分钟（6 小时，也是平台硬上限）。
    # 真正控制总时长的是程序里的「单账号时间盒」ACCOUNT_DEADLINE_SECONDS：
    # 盾类失败会不限次数地换 IP + 重开浏览器重试，直到该账号的时间盒用尽，
    # 所以单个分片上限约为 ceil(分片账号数 / --parallel) × 单账号时间盒。
    strategy:
      # 一个分片挂了不影响其余分片：账号之间本来就没有依赖关系
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装系统依赖（Camoufox/Firefox 运行库 + 中文字体）
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libgtk-3-0 libasound2t64 libdbus-glib-1-2 libx11-xcb1 libxcb1 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libnss3 \
            fonts-liberation fonts-noto-cjk ca-certificates

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装 Python 依赖（精简版，不含 PySide6 GUI）
        run: pip install -r requirements-ci.txt

      - name: 恢复 Camoufox 浏览器缓存（约几百 MB，命中后秒级恢复）
        id: camoufox-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/camoufox
            ~/.local/share/camoufox
          key: camoufox-${{ runner.os }}-${{ hashFiles('requirements-ci.txt') }}

      - name: 下载 Camoufox 浏览器（仅首次或依赖升级时）
        if: steps.camoufox-cache.outputs.cache-hit != 'true'
        run: python -m camoufox fetch

      # 注意：公共仓库的 Actions 缓存对外可读，这里刻意【不缓存】data/sessions.json
      # （其中含过盾 cookie）。cf_clearance 绑定出口 IP，每次 runner IP 不同基本
      # 都会重新过盾，缓存价值有限，放弃缓存换取安全。

      - name: 写入配置（来自 GitHub Secrets）
        env:
          CONFIG_JSON_B64: ${{ secrets.CONFIG_JSON_B64 }}
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: |
          if [ -n "$CONFIG_JSON_B64" ]; then
            printf '%s' "$CONFIG_JSON_B64" | base64 --decode > config.json
            CONFIG_SOURCE="CONFIG_JSON_B64"
          elif [ -n "$CONFIG_JSON" ]; then
            printf '%s' "$CONFIG_JSON" > config.json
            CONFIG_SOURCE="CONFIG_JSON（兼容旧配置，建议迁移到 CONFIG_JSON_B64）"
          else
            echo "::error::未设置 CONFIG_JSON_B64 secret。请添加完整 config.json 的 base64 文本；旧 CONFIG_JSON 仍兼容"
            exit 2
          fi
          python - "$CONFIG_SOURCE" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path("config.json")
          raw = path.read_text(encoding="utf-8")
          json.loads(raw)  # 先校验是合法 JSON，避免写入坏配置
          print(f"config.json 已写入（来源 {sys.argv[1]}，校验通过）")
          PY

      - name: 开始签到（headless 真无头 + 固定 6 账号并发 + 3 浏览器并发）
        # 两级并发管的不是一回事：
        #   账号级并发固定为 6，HTTP 快路径主要等待网络，保证整轮吞吐稳定；
        #   浏览器实例固定为 3，不再按 runner 的 CPU 核数动态计算，避免排队时
        #   在不同运行环境之间出现并发抖动。公开库 runner 是 4 vCPU/16GB，
        #   过 Turnstile 吃 CPU，开到 4 个反而会互相抢核拖慢每个实例。
        #
        # --shard 一个参数管两件事：挑出本片该跑的账号，以及只向平台领本片的代理。
        # 账号名不经 job output 传递 —— 它来自 secret 解出的配置，GitHub 会判定 output
        # 「可能含 secret」而整个跳过，下游 fromJson('') 直接报错。所以这里只传序号，
        # 名单由客户端按同一规则自己切（连续块，各片不重叠且覆盖全部）。
        run: |
          python main.py --headless --parallel 6 --browser-parallel 3 -v \
            --shard "${{ matrix.shard }}/${{ needs.plan.outputs.total }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: 上传排障截图与页面快照（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # 带上分片号：几个分片同时上传，同名 artifact 会互相覆盖
          name: checkin-shots-${{ matrix.shard }}
          path: data/shots
          if-no-files-found: ignore
          retention-days: 7
