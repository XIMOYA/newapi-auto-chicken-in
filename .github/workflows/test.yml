# ============================================================================ #
# .github/workflows/test.yml
# CI：PR 与推送时运行全仓库自动检查，防止回归。
#
#   Python  pytest        —— 根目录 tests/（依赖用 requirements-ci.txt + pytest）
#   Go      go vet/test   —— server/（模块 newapi-config-server）
#   Web     type-check / vitest / build —— web/（vue-tsc + vite）
#
# 与 checkin.yml（每日签到）互不干扰：
#   - 不改动签到 workflow 的 timeout 与失败 artifact 行为；
#   - 本文件只用独立的 concurrency group，不会取消正在进行的签到任务。
# ============================================================================ #

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# 同一 ref 有新提交时自动取消旧的 CI 运行，避免排队浪费 runner
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python pytest
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖（CI 精简依赖 + pytest）
        run: |
          pip install -r requirements-ci.txt
          pip install pytest

      - name: 运行 pytest
        run: pytest -q

  go:
    name: Go vet & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: server/go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  web:
    name: Web type-check / test / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖（npm ci 锁定版本）
        run: npm ci

      - name: Type check（vue-tsc）
        run: npm run type-check

      - name: 单元测试（vitest）
        run: npm test

      - name: 构建（type-check + vite build）
        run: npm run build
