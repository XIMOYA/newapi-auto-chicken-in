# ============================================================================ #
# .github/workflows/test.yml
# CI：PR 与推送时运行全仓库自动检查，防止回归。
#
#   Python  pytest        —— 根目录 tests/（依赖用 requirements-ci.txt + pytest）
#   Go      go vet/test   —— server/（模块 newapi-config-server）
#   Web     type-check / vitest / build —— web/（vue-tsc + vite）
#
# 与 checkin.yml（每日签到）互不干扰：
#   - 不改动签到 workflow 的 timeout 与失败 artifact 行为；
#   - 本文件只用独立的 concurrency group，不会取消正在进行的签到任务。
# ============================================================================ #

name: CI

on:
  push:
    # 纯文档和重建产物不改变任何行为，没必要占三个 runner 跑全套。
    # 注意 paths-ignore 是「全部文件都命中才跳过」，混合提交照样会跑
    paths-ignore:
      - '**.md'
      - 'server/newapi-config-server'
      - 'server/newapi-config-server-linux-amd64'
      - 'assets/**'
  pull_request:

permissions:
  contents: read
  checks: write        # 发布测试报告注解要写 checks

# 同一 ref 有新提交时自动取消旧的 CI 运行，避免排队浪费 runner
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # 一个版本挂掉也要看另一个的结果，否则分不清是版本问题还是代码问题
      matrix:
        # 3.10 是开发机在用的版本，3.11 是 checkin.yml 线上跑签到的版本，两个都得保证
        python-version: ['3.10', '3.11']
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: 安装依赖（CI 精简依赖 + 锁定版本的 pytest）
        run: |
          pip install -r requirements-ci.txt
          # pytest 版本必须和 requirements.txt 锁的一致。装最新版会让 CI 随上游发版
          # 随机变红：pytest 8.2 就改过 importorskip 的语义（只对 ModuleNotFoundError
          # 跳过），这类变化本地复现不出来。版本只在 requirements.txt 维护一份
          PYTEST_PIN=$(grep -E '^pytest==' requirements.txt)
          test -n "$PYTEST_PIN" || { echo "requirements.txt 里找不到锁定的 pytest 版本"; exit 1; }
          echo "使用 $PYTEST_PIN"
          pip install "$PYTEST_PIN"

      - name: 运行 pytest
        # JUnit 报告让失败明细能出现在 PR/提交的注解里。原来只有一句
        # "Process completed with exit code 1"，排查得去翻原始日志
        run: pytest -q --junitxml=junit/results-${{ matrix.python-version }}.xml

      - name: 发布测试报告
        if: always()          # 失败时才最需要它
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: junit/results-${{ matrix.python-version }}.xml
          check_name: pytest 明细 (${{ matrix.python-version }})
          fail_on_failure: false      # 失败与否由上一步的退出码决定，这里只负责展示

  go:
    name: Go vet & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: server/go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  web:
    name: Web type-check / test / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖（npm ci 锁定版本）
        run: npm ci

      - name: Type check（vue-tsc）
        run: npm run type-check

      - name: 单元测试（vitest）
        run: npm test

      - name: 构建（type-check + vite build）
        run: npm run build
